<ActionBar class="barraNav">
    <GridLayout columns="*, auto">
        <StackLayout col="0" horizontalAlignment="left" verticalAlignment="center">
            <Image src="~/app/images/logo.png" stretch="aspectFit"/>
        </StackLayout>
        <button col="1" pageTransition="slideRight" text="&#xf060;" class="fas icon" tap="toggleDrawer" [nsRouterLink]="['/menu']"></button>
    </GridLayout>
</ActionBar>

<StackLayout class="background-page">

    <Label class="h1 text-center" text="Materia prima" ></Label>
    <Button text="Leer materia prima" (tap)="obtenerTodos()"></Button>


    <StackLayout>
        <Label [text]="mensaje" padding="5"></Label>
        <ListView height="250" [items]="materiaPrima" (itemTap)="onItemTap($event)" class="list-group">
            <ng-template let-item="item" let-i="index" let-odd="odd" let-even="even">
                <GridLayout columns="30, 60, 100, *, *, *, *, *, *, auto, auto" [visibility]="verificarPermisos('ADMIN', 'GEREN') ? 'visible' : 'collapsed'">
                    <Label text="&#xf2ed;" col="9" class="far list-group-item" (tap)="eliminar(item)"></Label>
                    <Label text="&#xf044;" col="10" class="far list-group-item" (tap)="editar(item)"></Label>
                </GridLayout>
            </ng-template>
        </ListView>
    </StackLayout>
    

    <Button text="Crear Materia Prima" (tap)="agregar()" class="-primary" [visibility]="verificarPermisos('ADMIN', 'GEREN') ? 'visible' : 'collapsed'"></Button>

</StackLayout>
