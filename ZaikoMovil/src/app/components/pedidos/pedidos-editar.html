
<ActionBar class="barraNav">
    <GridLayout columns="*, auto">
        <StackLayout col="0" horizontalAlignment="left" verticalAlignment="center">
            <Image src="~/app/images/logo.png" stretch="aspectFit"/>
        </StackLayout>
        <button col="1" pageTransition="slideRight" text="&#xf060;" class="fas icon" tap="toggleDrawer" [nsRouterLink]="['/proveedores']"></button>
    </GridLayout>
</ActionBar>

<ScrollView>
    <StackLayout class="background-page">

        <GridLayout class="container-principal" style="padding: 10;padding-bottom: 50;" columns="auto, *" rows="auto, auto, auto, auto, auto, auto, auto, auto" horizontalAlignment="center">
            <Label class="h1 text-center" row="0" col="0" colSpan="2" text="Editar Pedido"></Label>

            <Label text="ID: " row="1" col="0" class="fas" verticalAlignment="middle"></Label>
            <TextField [text]='id' row="1" col="1" class="fas" color="orangered" editable="false" backgroundColor="#e0e0e0"></TextField>

            <Label text="Cantidad: " row="2" col="0" class="fas" verticalAlignment="middle"></Label>
            <TextField [text]='cantidad' maxLength="100" row="2" col="1" class="fas" color="black" (textChange)="inputChange($event, 'cantidad')"></TextField>

            <Label text="Precio unitario: " row="3" col="0" class="fas" verticalAlignment="middle"></Label>
            <TextField [text]='precio_unitario' maxLength="100" row="3" col="1" class="fas" color="orangered" (textChange)="inputChange($event, 'precio_unitario')"></TextField>

            <Label text="Producto: " row="4" col="0" class="fas" verticalAlignment="middle"></Label>
            <TextField [text]='productos' maxLength="100" row="4" col="1" class="fas" color="orangered" (textChange)="inputChange($event, 'productos')"></TextField>

            <Label text="Cliente: " row="5" col="0" class="fas" verticalAlignment="middle"></Label>
            <TextField [text]='clientes' maxLength="100" row="5" col="1" class="fas" color="orangered" (textChange)="inputChange($event, 'clientes')"></TextField>

            <Label text="Fecha pedido: " row="6" col="0" class="fas" verticalAlignment="middle"></Label>
            <TextField [text]='fecha_pedido' maxLength="100" row="6" col="1" class="fas" color="orangered" (textChange)="inputChange($event, 'fecha_pedido')"></TextField>

        </GridLayout>

        <Button class="btn-secundario" [text]="boton" (tap)="operar()"></Button>


    </StackLayout>
</ScrollView>
