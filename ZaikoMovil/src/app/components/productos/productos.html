<ActionBar class="barraNav">
    <GridLayout columns="*, auto">
        <StackLayout col="0" horizontalAlignment="left" verticalAlignment="center">
            <Image src="~/app/images/logo.png" stretch="aspectFit"/>
        </StackLayout>
        <button col="1" pageTransition="slideRight" text="&#xf060;" class="fas icon" tap="toggleDrawer" [nsRouterLink]="['/menu']"></button>
    </GridLayout>
</ActionBar>


<StackLayout class="background-page">

    <Label class="h1 text-center" text="Productos" ></Label>
    
    <Button class="btn-principal" text="Leer Productos" (tap)="obtenerTodos()"></Button>
    <Button class="btn-secundario" text="Crear Producto" (tap)="agregarCat()" [visibility]="verificarPermisos('ADMIN', 'GEREN') ? 'visible' : 'collapsed'"></Button>

    <ListView height="400" [items]="productos" (itemTap)="onItemTap($event)" class="">
        <ng-template let-item="item" let-i="index" let-odd="odd" let-even="even">
            <GridLayout rows="auto auto auto auto auto auto auto auto auto auto auto auto auto auto auto auto auto auto auto auto auto auto"columns="*, auto, *, *, *">

                <Label text="Foto" class="tamanoLetra3" col="0"></Label>
                <Label text="Nombre" class="tamanoLetra3" col="1"></Label>
                <Label text="Cantidad" class="tamanoLetra3" col="2"></Label>
                <Label text="Precio" class="tamanoLetra3" col="3"></Label>
                <Label text="Accion" class="tamanoLetra3" col="4" [visibility]="verificarPermisos('ADMIN', 'GEREN') ? 'visible' : 'collapsed'"></Label>
                <Image [src]="item.foto" width="20" height="20" row="1" col="0" class=""></Image>
                <Label [text]="item.nombre" col="1" row="1" class="tamanoLetra2"></Label>
                <Label [text]="item.cantidad" col="2" row="1" class="tamanoLetra2"></Label>
                <Label [text]="item.precio" col="3" row="1" class="tamanoLetra2"></Label>

                <GridLayout col="4" row="1" columns="*, *" height="80%" [visibility]="verificarPermisos('ADMIN', 'GEREN') ? 'visible' : 'collapsed'">
                    <Label text="&#xf31c;" row="1" col="1" class="fas editar"
                           (tap)="editarCat(item)"></Label>
                    <Label text="&#xf1f8;" row="1" col="0" class="fas eliminar"
                           (tap)="eliminarCat(item)"></Label>
                </GridLayout>

            </GridLayout>
        </ng-template>
    </ListView>

</StackLayout>
